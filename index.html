<body>

</dialog>
<script>
const CATEGORIES = ['Alquiler','Teléfono','Comida','Salidas','Viajes','Transporte','Suscripciones','Imprevistos','Otros'];
const INCOMES = ['Sueldo fijo','Paga extra','Bote o propinas','Trabajo extra','Horas extra','Otros ingresos'];
const money = cents => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(cents/100);
const dateISO = (date = new Date()) => [date.getFullYear(),date.getMonth()+1,date.getDate()].map(n=>String(n).padStart(2,'0')).join('-');
const shift = (date, days) => {
  const value = new Date(date+'T12:00:00Z');
  value.setUTCDate(value.getUTCDate()+days);
  return value.toISOString().slice(0,10);
};
const monday = date => shift(date,-((new Date(date+'T12:00:00Z').getUTCDay()+6)%7));
const duration = minutes => Math.floor(minutes/60)+' h '+String(minutes%60).padStart(2,'0')+' min';
const cents = input => Math.round(Number(String(input).replace(',','.'))*100);
const fail = message => { throw new Error(message); };
const ensure = (condition,message) => { if(!condition) fail(message); };
const integer = (value,min,max) => Number.isSafeInteger(value) && value>=min && value<=max;
const amount = (value,min=1) => ensure(integer(value,min,9_999_999_999),'Introduce un importe válido.');
const label = (value,max=100) => ensure(typeof value==='string' && value.trim().length>0 && value.length<=max,'Introduce un nombre válido.');
const validDate = date => typeof date==='string' && /^20\d\d-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(date) &&
  Number.isFinite(Date.parse(date)) && new Date(date).toISOString().slice(0,10)===date;
const requireDate = value => ensure(validDate(value),'Introduce una fecha válida.');
const requireMonth = value => ensure(typeof value==='string' && validDate(value+'-01'),'Elige un mes válido.');
const requireId = value => ensure(typeof value==='string' && /^[a-zA-Z0-9-]{1,60}$/.test(value),'Identificador inválido.');
const lookup = (list,id,name) => list.find(item=>item.id===id) || fail(name+' no disponible.');

function emptyLedger(){
  return {accounts:[],movements:[],fixed:[],jobs:[],hours:[],goals:[],budgets:[],rate:1250,salary:null};
}

function fixedDue(fixed,month){
  const [year,n] = month.split('-').map(Number);
  const last = new Date(Date.UTC(year,n,0)).getUTCDate();
  return month+'-'+String(Math.min(fixed.day,last)).padStart(2,'0');
}

function fixedStatus(state,month){
  return state.fixed.filter(item=>item.start<=month && (!item.end || item.end>=month))
    .map(item=>({
      ...item, due:fixedDue(item,month),
      payment:state.movements.find(row=>row.link?.type==='fixed' && row.link.id===item.id && row.link.period===month)
    })).sort((a,b)=>a.due.localeCompare(b.due));
}

function jobStatus(state,job){
  const paid = state.movements.filter(row=>row.link?.type==='job' && row.link.id===job.id)
    .reduce((total,row)=>total+row.amount,0);
  return {paid,pending:job.amount-paid};
}

function salaryStatus(state,period){
  if(!state.salary || state.salary.start>period)return null;
  const payment=state.movements.find(row=>row.link?.type==='salary' && row.link.period===period) ||
    state.movements.find(row=>row.type==='income' && row.category==='Sueldo fijo' && !row.link && row.date.startsWith(period));
  return {...state.salary,payment,period};
}

function weekStatus(state,week){
  const sunday=shift(week,6);
  const hours=state.hours.filter(row=>row.date>=week && row.date<=sunday).sort((a,b)=>a.date.localeCompare(b.date));
  const payments=state.movements.filter(row=>row.link?.type==='hours' && row.link.period===week);
  const minutes=hours.reduce((total,row)=>total+row.minutes,0);
  const estimate=Math.round(hours.reduce((total,row)=>total+row.minutes*row.rate,0)/60);
  const paid=payments.reduce((total,row)=>total+row.amount,0);
  const adjustment=payments.reduce((total,row)=>total+row.link.adjustment,0);
  return {hours,payments,minutes,estimate,paid,pending:estimate+adjustment-paid,sunday};
}

function goalBalance(state,id){
  return state.movements.filter(row=>row.link?.type==='goal' && row.link.id===id).reduce((sum,row)=>sum+row.amount,0);
}

function accountBalance(state,account,through){
  return state.movements.filter(row=>row.date<=through).reduce((balance,row)=>{
    if(row.type==='transfer') return balance+(row.to===account.id?row.amount:0)-(row.account===account.id?row.amount:0);
    if(row.account!==account.id || row.type==='allocation') return balance;
    return balance+(row.type==='income'?row.amount:-row.amount);
  },account.opening);
}

function monthSummary(state,month,today){
  const rows=state.movements.filter(row=>row.date.startsWith(month) && row.date<=today);
  const sum = type => rows.filter(row=>row.type===type).reduce((total,row)=>total+row.amount,0);
  const fixed=fixedStatus(state,month);
  const due=fixed.filter(row=>!row.payment || row.payment.date>today).reduce((total,row)=>total+row.amount,0);
  const balance=state.accounts.reduce((total,account)=>total+accountBalance(state,account,today),0);
  const reserved=state.movements.filter(row=>row.type==='allocation' && row.date<=today)
    .reduce((total,row)=>total+row.amount,0);
  return {rows, income:sum('income'), expense:sum('expense'), balance, reserved, due, available:balance-reserved-due,fixed};
}

function budgetStatus(state,month,today){
  const {rows}=monthSummary(state,month,today);
  return state.budgets.map(budget=>{
    const items=rows.filter(row=>row.type==='expense' && row.category===budget.category);
    const spent=items.reduce((total,row)=>total+row.amount,0);
    return {...budget,spent,remaining:budget.limit-spent,items};
  });
}

function goalPlan(state,goal,today){
  const saved=goalBalance(state,goal.id);
  const remaining=Math.max(0,goal.amount-saved);
  const [y,m]=today.split('-').map(Number);
  const [gy,gm]=goal.target?.split('-').map(Number) || [];
  const months=goal.target && goal.target>=today ? Math.max(1,(gy-y)*12+gm-m) : 0;
  return {saved,remaining,monthly:months?Math.ceil(remaining/months):null};
}

function post(state,event,details){
  requireDate(details.date);
  amount(details.amount,details.type==='allocation'?-9_999_999_999:1);
  if(details.type!=='allocation') lookup(state.accounts,details.account,'Cuenta');
  if(details.type==='transfer'){
    lookup(state.accounts,details.to,'Cuenta de destino');
    ensure(details.account!==details.to,'Elige dos cuentas distintas.');
  }
  if(details.note) label(details.note,180);
  state.movements.push({...details,id:event.id});
}

function apply(state,event){
  ensure(event && typeof event==='object' && !Array.isArray(event),'Movimiento inválido.');
  requireId(event.id);
  switch(event.type){
    case 'account': {
      label(event.name); amount(event.opening,-9_999_999_999);
      ensure(['Banco','Efectivo','Otro'].includes(event.kind),'Tipo de cuenta inválido.');
      state.accounts.push({id:event.id,name:event.name,opening:event.opening,kind:event.kind});
      break;
    }
    case 'accountEdit': {
      const account=lookup(state.accounts,event.account,'Cuenta');
      label(event.name); amount(event.opening,-9_999_999_999);
      account.name=event.name; account.opening=event.opening;
      break;
    }
    case 'movement':
    case 'movementEdit': {
      ensure(['income','expense','transfer'].includes(event.kind),'Tipo de movimiento inválido.');
      if(event.kind==='expense') ensure(CATEGORIES.includes(event.category),'Categoría inválida.');
      if(event.kind==='income') ensure(INCOMES.includes(event.category) && event.category!=='Horas extra','Usa la sección Horas extra para confirmar ese cobro.');
      const previous=event.type==='movementEdit'?lookup(state.movements,event.movement,'Movimiento'):null;
      ensure(!previous?.link,'Edita este movimiento desde su apartado de origen.');
      post(state,previous?{id:previous.id}:event,{type:event.kind,date:event.date,amount:event.amount,
        account:event.account,to:event.kind==='transfer'?event.to:null,category:event.kind==='transfer'?'Traspaso':event.category,note:event.note||''});
      if(previous) state.movements.splice(state.movements.indexOf(previous),1);
      break;
    }
    case 'remove': {
      const row=lookup(state.movements,event.movement,'Movimiento');
      if(row.link?.type==='goal'){
        ensure(goalBalance(state,row.link.id)-row.amount>=0,'Esta corrección dejaría la meta con un importe negativo.');
      }
      if(row.link?.type==='hours'){
        const status=weekStatus(state,row.link.period);
        ensure(status.pending+row.amount-row.link.adjustment>=0,'Corrige primero los cobros posteriores de esta semana.');
      }
      state.movements.splice(state.movements.indexOf(row),1);
      break;
    }
    case 'fixed': {
      label(event.name); amount(event.amount); requireMonth(event.start);
      ensure(integer(event.day,1,31),'Elige un día entre 1 y 31.');
      ensure(CATEGORIES.includes(event.category),'Categoría inválida.');
      lookup(state.accounts,event.account,'Cuenta');
      state.fixed.push({id:event.id,name:event.name,amount:event.amount,day:event.day,category:event.category,start:event.start,account:event.account});
      break;
    }
    case 'fixedStop': {
      const fixed=lookup(state.fixed,event.fixed,'Gasto fijo');
      requireMonth(event.end);
      fixed.end=event.end;
      break;
    }
    case 'salary': {
      amount(event.amount,0);
      if(!event.amount){state.salary=null;break;}
      requireMonth(event.start);
      lookup(state.accounts,event.account,'Cuenta');
      ensure(integer(event.day,1,31),'Elige un día entre 1 y 31.');
      state.salary={amount:event.amount,account:event.account,day:event.day,start:event.start};
      break;
    }
    case 'salaryPay': {
      requireMonth(event.period);
      const salary=salaryStatus(state,event.period);
      ensure(salary && !salary.payment,'El sueldo de este periodo ya se registró o no está previsto.');
      post(state,event,{type:'income',date:event.date,amount:event.amount,account:event.account,
        category:'Sueldo fijo',note:'Sueldo de '+event.period,link:{type:'salary',period:event.period}});
      break;
    }
    case 'fixedPay': {
      requireMonth(event.period);
      const fixed=lookup(fixedStatus(state,event.period),event.fixed,'Gasto fijo');
      ensure(!fixed.payment,'Este vencimiento ya está pagado.');
      post(state,event,{type:'expense',date:event.date,amount:event.amount,account:event.account,
        category:fixed.category,note:fixed.name,link:{type:'fixed',id:fixed.id,period:event.period}});
      break;
    }
    case 'job': {
      label(event.name); amount(event.amount); requireDate(event.date);
      if(event.due) requireDate(event.due);
      state.jobs.push({id:event.id,name:event.name,amount:event.amount,date:event.date,due:event.due||''});
      break;
    }
    case 'jobPay': {
      const job=lookup(state.jobs,event.job,'Trabajo');
      amount(event.amount);
      ensure(event.amount<=jobStatus(state,job).pending,'El cobro supera el importe pendiente.');
      ensure(event.date>=job.date,'La fecha de cobro es anterior al trabajo.');
      post(state,event,{type:'income',date:event.date,amount:event.amount,account:event.account,
        category:'Trabajo extra',note:job.name,link:{type:'job',id:job.id}});
      break;
    }
    case 'rate':
      amount(event.amount); state.rate=event.amount; break;
    case 'hours': {
      requireDate(event.date);
      ensure(integer(event.minutes,0,1440),'Introduce entre 0 y 24 horas.');
      amount(event.rate);
      const index=state.hours.findIndex(row=>row.date===event.date);
      if(index>=0) state.hours.splice(index,1);
      if(event.minutes) state.hours.push({date:event.date,minutes:event.minutes,rate:event.rate});
      ensure(weekStatus(state,monday(event.date)).pending>=0,'Corrige primero los cobros asociados a la semana.');
      break;
    }
    case 'hoursPay': {
      requireDate(event.period);
      ensure(monday(event.period)===event.period && event.date>=event.period,'La fecha de cobro es anterior a la semana trabajada.');
      const {pending}=weekStatus(state,event.period);
      amount(event.amount);
      ensure(pending>0,'Esta semana no tiene horas pendientes de cobro.');
      ensure(event.amount<=pending || event.final===true,'Marca el cobro como definitivo si el importe es distinto.');
      post(state,event,{type:'income',date:event.date,amount:event.amount,account:event.account,
        category:'Horas extra',note:'Semana del '+event.period,
        link:{type:'hours',period:event.period,adjustment:event.final===true?event.amount-pending:0}});
      break;
    }
    case 'goal': {
      label(event.name); amount(event.amount);
      if(event.target) requireDate(event.target);
      ensure(['Corto plazo','Largo plazo'].includes(event.term),'Plazo inválido.');
      state.goals.push({id:event.id,name:event.name,amount:event.amount,target:event.target||'',term:event.term});
      break;
    }
    case 'allocation': {
      const goal=lookup(state.goals,event.goal,'Meta');
      amount(event.amount,-9_999_999_999);
      ensure(event.amount!==0 && goalBalance(state,goal.id)+event.amount>=0,'La retirada supera el ahorro apartado.');
      post(state,event,{type:'allocation',date:event.date,amount:event.amount,category:'Meta',note:goal.name,link:{type:'goal',id:goal.id}});
      break;
    }
    case 'budget': {
      ensure(CATEGORIES.includes(event.category),'Categoría inválida.');
      amount(event.amount,0);
      state.budgets=state.budgets.filter(row=>row.category!==event.category);
      if(event.amount) state.budgets.push({category:event.category,limit:event.amount,flexible:event.flexible===true});
      break;
    }
    default: fail('Acción desconocida.');
  }
  return state;
}

function replay(events){
  ensure(Array.isArray(events) && events.length<=20_000,'Copia inválida o demasiado grande.');
  const state=emptyLedger();
  const ids=new Set();
  for(const event of events){
    ensure(!ids.has(event?.id),'La copia contiene movimientos duplicados.');
    apply(state,event);
    ids.add(event.id);
  }
  return state;
}

const storageKey = 'freya-html-vault-v1';
const iterations = 600000;
const utf8 = new TextEncoder();
const to64 = bytes => {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 8192) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }
  return btoa(binary);
};
const from64 = value => Uint8Array.from(atob(value), letter => letter.charCodeAt(0));
const vaultInfo = utf8.encode('freya-vault:1');

async function deriveKey(password, salt) {
  const material = await crypto.subtle.importKey('raw', utf8.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, material,
    {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}

async function openVault(record, password) {
  if (record?.format !== 'freya-vault' || record.version !== 1) throw new Error('Copia cifrada incompatible.');
  try {
    const salt = from64(record.salt);
    const iv = from64(record.iv);
    if (salt.length !== 16 || iv.length !== 12) throw new Error();
    const key = await deriveKey(password, salt);
    const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:vaultInfo}, key, from64(record.data));
    const rows = JSON.parse(new TextDecoder().decode(clear));
    replay(rows);
    return {rows,key,salt};
  } catch {
    throw new Error('La contraseña es incorrecta o la copia está dañada.');
  }
}


const profilesKey = 'freya-html-profiles-v1';
const masterInfo = 'freya:master';
let profileId, profileKey, profileSnapshot;
const randomBytes = length => crypto.getRandomValues(new Uint8Array(length));
const readProfiles = () => JSON.parse(localStorage.getItem(profilesKey) || 'null');
const seal = async (key, clear, context) => {
  const iv = randomBytes(12);
  const data = await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:utf8.encode(context)},key,clear);
  return {iv:to64(iv),data:to64(new Uint8Array(data))};
};
const unseal = async (key, envelope, context) => {
  try {
    return new Uint8Array(await crypto.subtle.decrypt(
      {name:'AES-GCM',iv:from64(envelope.iv),additionalData:utf8.encode(context)},key,from64(envelope.data)));
  } catch {
    throw new Error('Contraseña incorrecta o datos dañados.');
  }
};
const importDataKey = raw => crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
const profileContext = (type,key) => 'freya:profile:'+key+':'+type;
const decode = value => new TextDecoder().decode(value);

async function updateProfiles(change) {
  const save = async () => {
    const previous = localStorage.getItem(profilesKey);
    const next = await change(JSON.parse(previous || 'null'));
    if (localStorage.getItem(profilesKey) !== previous) {
      throw Object.assign(new Error('Los perfiles cambiaron en otra pestaña. Vuelve a abrir Freya.'),{status:409});
    }
    localStorage.setItem(profilesKey,JSON.stringify(next));
  };
  if (navigator.locks) await navigator.locks.request(profilesKey,save);
  else await save();
}

async function getMaster(db,password) {
  const key = await deriveKey(password,from64(db.master.salt));
  await unseal(key,db.master.check,masterInfo);
  return key;
}
async function wrapPassword(key, raw, password) {
  const salt = randomBytes(16);
  const passwordKey = await deriveKey(password,salt);
  return {salt:to64(salt),...await seal(passwordKey,raw,profileContext('password',key))};
}
async function addProfile(db, fields, masterKey, rows) {
  const key = id();
  const raw = randomBytes(32);
  const dataKey = await importDataKey(raw);
  const profile = {
    id:key,
    name:fields.get('name').trim(),
    email:fields.get('email').trim(),
    password:await wrapPassword(key,raw,fields.get('password')),
    recovery:await seal(masterKey,raw,profileContext('recovery',key)),
    content:await seal(dataKey,utf8.encode(JSON.stringify(rows)),profileContext('data',key))
  };
  if (!profile.name) throw new Error('Escribe un nombre para el perfil.');
  db.profiles.push(profile);
}
async function openProfileBackup(profile,password) {
  const passwordKey = await deriveKey(password,from64(profile.password.salt));
  const raw = await unseal(passwordKey,profile.password,profileContext('password',profile.id));
  const key = await importDataKey(raw);
  const rows = JSON.parse(decode(await unseal(key,profile.content,profileContext('data',profile.id))));
  replay(rows);
  return {key,rows};
}
async function write(next) {
  replay(next);
  const content = await seal(profileKey,utf8.encode(JSON.stringify(next)),profileContext('data',profileId));
  await updateProfiles(db => {
    const index = db.profiles.findIndex(profile => profile.id === profileId);
    if (index < 0 || JSON.stringify(db.profiles[index]) !== JSON.stringify(profileSnapshot)) {
      throw Object.assign(new Error('Este perfil cambió. Bloquéalo y vuelve a entrar.'),{status:409});
    }
    db.profiles[index].content = content;
    return db;
  });
  profileSnapshot = {...profileSnapshot,content};
  replace(next);
  render();
}

}

function login(mode='login') {
  ready = false;
  screen.hidden = get('nav').hidden = get('settings').hidden = true;
  auth.hidden = false;
  const db = readProfiles();
  const legacy = db ? null : localStorage.getItem(storageKey);
  if (!db) mode = 'setup';
  const choices = db ? select('profile','Perfil',db.profiles.map(p=>[p.id,p.name])) : '';
  const fields = {
    setup: (legacy?passwordField('legacy','Contraseña de la versión anterior'):'')+profileFields()+
      passwordField('master','Crea una contraseña maestra',true)+passwordField('masterConfirm','Repite la contraseña maestra',true),
    login:choices+passwordField('password','Contraseña del perfil'),
    add:masterField()+profileFields(),
    reset:choices+masterField()+passwordField('password','Nueva contraseña del perfil',true)+passwordField('confirm','Repite la nueva contraseña',true)
  };
  const titles = {setup:'Configura Freya',login:'Entra en tu perfil',add:'Crear perfil',reset:'Restablecer contraseña'};
  auth.innerHTML = `<h1>${titles[mode]}</h1>${mode==='setup'?note(legacy?
    'Introduce la contraseña anterior para conservar tus datos en el primer perfil.':
    'Elige dos contraseñas distintas de al menos 12 caracteres. Guarda la maestra para crear perfiles y recuperar el acceso.') : ''}
    <form>${fields[mode]}<button type="submit" class="primary">${mode==='login'?'Entrar':'Guardar'}</button><p role="alert" class="error"></p></form>
    ${mode==='login'?actions('<button type="button" data-mode="add">Crear perfil</button>','<button type="button" data-mode="reset">Olvidé mi contraseña</button>'):
    mode!=='setup'?actions('<button type="button" data-mode="login">Volver</button>'):''}`;
  const switches = [...auth.querySelectorAll('[data-mode]')];
  switches.forEach(control=>control.onclick=()=>login(control.dataset.mode));
  auth.querySelector('form').onsubmit = async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const submit = form.querySelector('[type=submit]');
    const values = new FormData(form);
    submit.disabled = true;
    switches.forEach(control=>control.disabled=true);
    try {
      if (mode === 'login') {
        const profile = db.profiles.find(item=>item.id===values.get('profile'));
        const opened = await openProfileBackup(profile,values.get('password'));
        const latest = readProfiles()?.profiles.find(item=>item.id===profile.id);
        if (JSON.stringify(latest) !== JSON.stringify(profile)) throw new Error('El perfil cambió. Recarga la página.');
        profileId = profile.id;
        profileKey = opened.key;
        profileSnapshot = profile;
        replace(opened.rows);
        form.reset();
        auth.replaceChildren();
        get('mode').textContent = profile.name;
        activate();
        return;
      }
      checkPasswords(values,mode==='setup');
      if (mode === 'setup') {
        const rows = legacy ? (await openVault(JSON.parse(legacy),values.get('legacy'))).rows : [];
        await updateProfiles(async current=>{
          if(current) throw new Error('Los perfiles ya se configuraron. Recarga la página.');
          const salt = randomBytes(16);
          const key = await deriveKey(values.get('master'),salt);
          const next = {master:{salt:to64(salt),check:await seal(key,utf8.encode('ok'),masterInfo)},profiles:[]};
          await addProfile(next,values,key,rows);
          return next;
        });
      } else {
        const key = await getMaster(db,values.get('master'));
        await updateProfiles(async current=>{
          if (current.master.check.data !== db.master.check.data) throw new Error('La contraseña maestra cambió. Vuelve a entrar.');
          if (mode === 'add') await addProfile(current,values,key,[]);
          else {
            const profile = current.profiles.find(item=>item.id===values.get('profile'));
            const raw = await unseal(key,profile.recovery,profileContext('recovery',profile.id));
            profile.password = await wrapPassword(profile.id,raw,values.get('password'));
          }
          return current;
        });
      }
      login();
      announce(mode==='reset'?'Contraseña restablecida. Entra con la nueva.':'Perfil creado. Entra con su contraseña.');
    } catch (error) {
      form.querySelector('[role=alert]').textContent = error.message;
    } finally {
      submit.disabled = false;
      switches.forEach(control=>control.disabled=false);
    }
  };
}
function profileBackup() {
  const {id,password,content} = profileSnapshot;
  return JSON.stringify({format:'freya-profile',version:1,id,password,content});
}
function backupFileName() {
  return 'freya-respaldo-'+today()+'.json';
}
async function shareBackup() {
  const file = new File([profileBackup()],backupFileName(),{type:'application/json'});
  if (navigator.canShare?.({files:[file]})) {
    try {
      await navigator.share({files:[file],title:'Copia de Freya Finanzas',text:'Copia cifrada para '+profileSnapshot.email});
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  const recipient = encodeURIComponent(profileSnapshot.email).replace('%40','@');
  const subject = encodeURIComponent('Copia de seguridad de Freya Finanzas');
  const body = encodeURIComponent('Adjunta el archivo descargado '+backupFileName()+'.');
  information('Enviar copia por correo',
    note('Descarga la copia cifrada y adjúntala en tu aplicación de correo.')+
    actions(button('Descargar copia','backup'),`<a href="mailto:${recipient}?subject=${subject}&amp;body=${body}">Abrir correo</a>`));
}
function startLocal() {
  try {
    if (!globalThis.crypto?.subtle || !globalThis.crypto?.randomUUID) throw new Error();
    const probe = profilesKey+':probe';
    localStorage.setItem(probe,'1');
    localStorage.removeItem(probe);
    get('mode').textContent = 'Archivo local';
    announce();
    login();
  } catch {
    announce('Este visor no permite abrir los datos cifrados. Abre el HTML en un navegador compatible.');
  }
}

function edit(title,fields,onSave,verb='Guardar'){
  get('dialog-title').textContent=title;
  get('dialog-content').innerHTML=`<form>${fields}<p role="alert" class="error"></p>
    <div class="actions"><button type="submit" class="primary">${verb}</button><button type="button" data-action="close">Cancelar</button></div>
  </form>`;
  if(!dialog.open) dialog.showModal();
  const form=dialog.querySelector('form');
  const submit=form.querySelector('[type=submit]');
  const cancel=form.querySelector('[data-action=close]');
  dialog.oncancel=event=>{if(cancel.disabled)event.preventDefault();};
  form.onsubmit=async event=>{
    event.preventDefault();
    if(submit.disabled)return;
    submit.disabled=cancel.disabled=true;
    let after;
    let conflict=false;
    try{
      after=await onSave(new FormData(form));
    }catch(error){
      conflict=error.status===409;
      form.querySelector('[role=alert]').textContent=error.message;
      return;
    }finally{submit.disabled=conflict;cancel.disabled=false;}
    dialog.close();
    if(typeof after==='function')after();
  };
}

    ${actions(button('+ Registrar horas','hours-add','',true),button('Tarifa habitual','rate'))}
    ${card(today()===summary.sunday?'Resumen del domingo':'Resumen semanal',
      `<label>Semana de <input id="week-filter" type="date" value="${week}" max="${today()}"></label>
      <p>${displayDate(week)} – ${displayDate(summary.sunday)} · <strong>${duration(summary.minutes)}</strong></p>
      <p>Estimado ${money(summary.estimate)} · Cobrado ${money(summary.paid)} · Pendiente <strong>${money(summary.pending)}</strong></p>
      ${summary.pending>0?button('Registrar cobro','hours-pay',week,true):''}`)}
    ${card('Horas por día',summary.hours.map(item=>row(displayDate(item.date)+' · '+duration(item.minutes)+' · '+money(item.rate)+'/h',button('Editar','hours-add',item.date))).join('')||note('Aún no hay horas registradas en esta semana.'))}
    ${card('Cobros de la semana',cashRows)}
    ${pending.length?card('Otras semanas pendientes',pending.map(item=>row(displayDate(item.period)+' · '+money(item.pending),button('Ver semana','week',item.period))).join('')):''}`;
}
function goals(){
  return `<h1>Metas</h1>${actions(button('+ Nueva meta','goal','',true))}`+(
    state.goals.map(goal=>{
      const {saved,remaining,monthly}=goalPlan(state,goal,today());
      return card(escape(goal.name),`<p class="muted">${goal.term}${goal.target?' · '+displayDate(goal.target):''}</p>
      <p><strong>${money(saved)}</strong> de ${money(goal.amount)} apartados</p>
      <progress max="${goal.amount}" value="${Math.min(saved,goal.amount)}" aria-label="Progreso de ${escape(goal.name)}"></progress>
      <p>Faltan ${money(remaining)}${monthly===null?'':' · ${money(monthly)} al mes'}</p>
      ${actions(button('Apartar dinero','allocate',goal.id,true),...(saved>0?[button('Retirar','withdraw',goal.id)]:[]))}
      <details><summary>Ver aportaciones</summary>${movementRows(state.movements.filter(row=>row.link?.type==='goal' && row.link.id===goal.id))}</details>`);
    }).join('')||note('Crea una meta a corto o largo plazo para empezar.'));
}
function accounts(){
  return `<h1>Cuentas</h1>${actions(button('+ Nueva cuenta','account','',true),button('Traspaso','movement','transfer'))}`+
    (state.accounts.map(account=>card(escape(account.name),`<p>${account.kind} · Saldo <strong>${money(accountBalance(state,account,today()))}</strong></p>
      <p>Saldo inicial ${money(account.opening)}</p>${button('Editar','account',account.id)}`)).join('')||note('Crea una cuenta de banco o efectivo para registrar movimientos.'));
}
function fixed(){
  return `<h1>Gastos fijos</h1>${actions(button('+ Nuevo gasto fijo','fixed','',true))}`+
    card('Vencimientos de '+titleMonth(month),monthControl()+dueRows(fixedStatus(state,month).map(item=>({...item,period:month}))))+
    card('Pagos configurados',state.fixed.map(item=>row(
      `<div><strong>${escape(item.name)}</strong><p class="muted">${money(item.amount)} · día ${item.day}${item.end?' · finaliza '+titleMonth(item.end):''}</p></div>`,
      button('Definir último mes','fixed-stop',item.id)
    )).join('')||note('Configura alquiler, teléfono u otros pagos recurrentes.'));
}
function jobs(){
  return `<h1>Trabajos extra</h1>${actions(button('+ Nuevo trabajo','job','',true))}`+
    (state.jobs.map(job=>{
      const {paid,pending}=jobStatus(state,job);
      return card(escape(job.name),`<p>Acordado ${money(job.amount)} · Cobrado ${money(paid)} · Pendiente <strong>${money(pending)}</strong></p>
        ${job.due?note('Cobro previsto · '+displayDate(job.due)):''}
        ${pending>0?button('Registrar abono','job-pay',job.id,true):'<p>Pagado</p>'}
        <details><summary>Ver abonos</summary>${movementRows(state.movements.filter(row=>row.link?.type==='job'&&row.link.id===job.id))}</details>`);
    }).join('')||note('Registra un trabajo y apunta cada pago cuando lo recibas.'));
}
function budgetsBlock(homeView=false){
  const period=homeView?monthNow():month;
  const items=budgetStatus(state,period,today());
  const visible=homeView?items.filter(item=>item.flexible && item.remaining<0):items;
  return card(homeView?'Ideas de ahorro':'Límites por categoría',
    (homeView?'':monthControl())+visible.map(item=>row(
      `<div><strong>${item.category}</strong><p>${money(item.spent)} de ${money(item.limit)}${item.remaining<0?' · Exceso '+money(-item.remaining):' · Quedan '+money(item.remaining)}</p></div>`,
      button('Ver gastos','budget-detail',item.category+'|'+period)
    )).join('')+(visible.length?'':note(homeView?'Las categorías flexibles están dentro del límite, o todavía no tienen un presupuesto.':'Configura un límite mensual para una categoría.'))+
    (homeView?button('Ver presupuestos','route','presupuestos'):button('Configurar límite','budget','',true)));
}
function preferences(){
  return `<h1>Ajustes</h1>`+card('Sueldo previsto',
    note(state.salary?'Sueldo mensual de '+money(state.salary.amount)+' · día '+state.salary.day:'Puedes configurar un sueldo mensual y confirmar el importe real al cobrar.')+
    button('Configurar sueldo','salary'))+card('Datos y copia de seguridad',
    note('Tus datos se guardan cifrados en este navegador. Guarda una copia para recuperarlos o llevarlos a otro dispositivo.')+
    actions(button('Exportar copia','backup'),button('Importar copia','restore'))+
    actions(button('Enviar copia por correo','share-backup'),button('Bloquear perfil','logout')));
}
const views={inicio:home,agenda:agendaView,movimientos:movements,horas:hoursView,metas:goals,cuentas:accounts,fijos:fixed,trabajos:jobs,
  presupuestos:()=>'<h1>Presupuestos</h1>'+budgetsBlock(),ajustes:preferences};
function route(){
  const value=location.hash.slice(1);
  return Object.hasOwn(views,value)?value:'inicio';
}
function render(){
  if(!ready)return;
  const view=route();
  screen.innerHTML=views[view]();
  const active=['cuentas','fijos','trabajos','presupuestos'].includes(view)?'movimientos':view;
  for(const link of get('nav').querySelectorAll('a')){
    if(link.hash==='#'+active)link.setAttribute('aria-current','page');
    else link.removeAttribute('aria-current');
  }
}

function find(list,key){
  const item=list.find(row=>row.id===key);
  if(!item)throw new Error('El registro ya no está disponible.');
  return item;
}
function needAccount(){
  if(!state.accounts.length){accountEditor();return false;}
  return true;
}
function accountEditor(key){
  const previous=key?find(state.accounts,key):null;
  edit(previous?'Editar cuenta':'Nueva cuenta',nameField(previous?.name)+
    (previous?'':select('kind','Tipo',['Banco','Efectivo','Otro']))+
    euro('opening','Saldo inicial (€)',cash(previous?.opening??0),'-99999999.99'),fields=>
    commit({type:previous?'accountEdit':'account',account:key,name:fields.get('name').trim(),kind:fields.get('kind'),opening:cents(fields.get('opening'))}));
}
function movementEditor(kind,previous){
  if(!needAccount())return;
  if(kind==='transfer' && state.accounts.length<2)throw new Error('Crea dos cuentas para registrar un traspaso.');
  const title={income:'Ingreso',expense:'Gasto',transfer:'Traspaso'}[kind];
  const category=kind==='transfer'?'':select('category','Categoría',
    kind==='income'?INCOMES.filter(item=>item!=='Horas extra'):CATEGORIES,previous?.category);
  edit((previous?'Editar ':'Registrar ')+title.toLowerCase(),category+
    accountField('account',kind==='transfer'?'Cuenta de origen':'Cuenta',previous?.account)+
    (kind==='transfer'?accountField('to','Cuenta de destino',previous?.to||state.accounts[1].id):'')+
    euro('amount','Importe (€)',previous?cash(previous.amount):'')+
    dateField('date','Fecha',previous?.date||dayFilter||today())+
    input('note','Concepto (opcional)','text',previous?.note||'','maxlength="180"'),fields=>
    commit({type:previous?'movementEdit':'movement',movement:previous?.id,kind,category:fields.get('category'),
      account:fields.get('account'),to:fields.get('to'),amount:cents(fields.get('amount')),date:fields.get('date'),note:fields.get('note').trim()}));
}

function hoursEditor(day){
  const previous=day?state.hours.find(item=>item.date===day):null;
  edit(previous?'Editar horas extra':'Registrar horas extra',
    input('date','Fecha trabajada','date',day||today(),`max="${today()}" required ${previous?'readonly':''}`)+
    input('hours','Horas','number',Math.floor((previous?.minutes||0)/60),'min="0" max="24" required')+
    input('minutes','Minutos','number',(previous?.minutes||0)%60,'min="0" max="59" required')+
    euro('rate','Tarifa por hora (€)',cash(previous?.rate??state.rate))+
    (previous?note('Para quitar el registro, deja horas y minutos a cero.'):''),
    async fields=>{
      const date=fields.get('date');
      const minutes=Number(fields.get('hours'))*60+Number(fields.get('minutes'));
      if(!previous && !minutes)throw new Error('Introduce al menos un minuto.');
      if(!previous && state.hours.some(item=>item.date===date))throw new Error('Ya hay un registro para ese día. Abre la semana y pulsa Editar.');
      await commit({type:'hours',date,minutes,rate:cents(fields.get('rate'))});
      week=monday(date);
      return ()=>{location.hash='horas';render();};
    });
}
function backup(){
  const blob=new Blob([profileBackup()],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download=backupFileName();link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function readBackup(data){
  if(data?.format==='freya-ledger' && data.version===3){
    replay(data.events);
    return data.events;
  }
  if(!Array.isArray(data?.expenses))throw new Error('Esta copia no tiene un formato compatible.');
  const account=id();
  const previous=[{id:account,type:'account',name:'Historial importado',kind:'Otro',opening:0}];
  for(const expense of data.expenses){
    const category=expense.category==='Alimentación'?'Comida':expense.category==='Ocio'?'Salidas':expense.category;
    previous.push({id:id(),type:'movement',kind:'expense',category:CATEGORIES.includes(category)?category:'Otros',
      amount:cents(expense.amount),date:expense.date,account,note:String(expense.description||'').slice(0,180)});
  }
  replay(previous);
  return previous;
}

  goal:()=>edit('Nueva meta',nameField()+euro('amount','Objetivo (€)')+select('term','Plazo',['Corto plazo','Largo plazo'])+
    dateField('target','Fecha objetivo (opcional)','',false),fields=>commit({type:'goal',
    name:fields.get('name').trim(),amount:cents(fields.get('amount')),term:fields.get('term'),target:fields.get('target')})),
  allocate:key=>allocationEditor(key,false),
  withdraw:key=>allocationEditor(key,true),
  budget:()=>edit('Presupuesto mensual',select('category','Categoría',CATEGORIES)+
    euro('amount','Límite mensual (€), cero para quitarlo','','0')+checkbox('flexible','Categoría flexible para sugerencias de ahorro'),
    fields=>commit({type:'budget',category:fields.get('category'),amount:cents(fields.get('amount')),flexible:fields.has('flexible')})),
  'budget-detail':key=>{
    const [category,period]=key.split('|');
    const item=budgetStatus(state,period,today()).find(row=>row.category===category);
    if(item) information(category+' · '+titleMonth(period),
      note('Has registrado '+money(item.spent)+' frente a un límite de '+money(item.limit)+'.')+
      (item.flexible && item.remaining<0 ? note('Si el próximo mes mantienes este límite, podrías gastar '+money(-item.remaining)+' menos que en el periodo seleccionado.'):'')+
      movementRows(item.items));
  },
  'calendar-day':key=>{dayFilter=key;render();},
  'calendar-toggle':()=>{calendar=!calendar;dayFilter='';render();},
  backup,
  restore:()=>edit('Restaurar copia',
    note('La restauración sustituye los datos actuales. Puedes importar una copia de esta versión o los gastos de una copia antigua.')+
    input('file','Copia JSON','file','','accept="application/json,.json" required')+
    input('backupPassword','Contraseña de la copia cifrada','password','','autocomplete="off"')+
    checkbox('confirm','Confirmo que quiero sustituir los datos actuales'),async fields=>{
      if(!fields.has('confirm'))throw new Error('Confirma la sustitución de los datos.');
      const file=fields.get('file');
      if(file.size>6_000_000)throw new Error('La copia es demasiado grande.');
      const data = JSON.parse(await file.text());
      const password = fields.get('backupPassword');
      let rows;
      if (data?.format === 'freya-profile' && data.version === 1) rows = (await openProfileBackup(data,password)).rows;
      else if (data?.format === 'freya-vault') rows = (await openVault(data,password)).rows;
      else rows = readBackup(data);
      await write(rows);
    },'Restaurar'),
  'share-backup':shareBackup,
  logout:lock
};
function allocationEditor(key,withdraw){
  const goal=find(state.goals,key);
  edit((withdraw?'Retirar de ':'Apartar para ')+goal.name,euro('amount','Importe (€)')+dateField('date','Fecha'),
    fields=>commit({type:'allocation',goal:key,date:fields.get('date'),amount:cents(fields.get('amount'))*(withdraw?-1:1)}));
}

document.addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action]');
  if(!button || button.disabled)return;
  const {action,key}=button.dataset;
  if(!ready)return;
  try{
    await handlers[action]?.(key);
  }catch(error){
    announce(error.message);
  }
});
screen.addEventListener('change',event=>{
  const input=event.target;
  if(input.id==='agenda-date'){if(input.validity.valid)selectAgendaDate(input.value,'#agenda-date');return;}
  if(input.id==='month-filter' && input.value && input.validity.valid){month=input.value;dayFilter='';}
  else if(input.id==='week-filter' && input.value && input.validity.valid)week=monday(input.value);
  else if(input.id==='movement-filter')movementFilter=input.value;
  else return;
  render();
  get(input.id)?.focus();
});
screen.addEventListener('input',event=>{
  if(event.target.id!=='movement-query')return;
  movementQuery=event.target.value;
  get('movement-results').innerHTML=movementResults();
});
get('settings').onclick=()=>{location.hash='ajustes';};
window.addEventListener('hashchange',()=>{announce();render();window.scrollTo(0,0);});
startLocal();
const installButton = get('install');
const installHelp = get('install-help');
const standalone = matchMedia('(display-mode: standalone)');
const syncInstallButton = () => { installButton.hidden = standalone.matches || navigator.standalone === true; };
let installPrompt;
syncInstallButton();
standalone.addEventListener('change',syncInstallButton);
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt = event;
});
window.addEventListener('appinstalled',()=>{
  installPrompt = undefined;
  installButton.hidden = true;
});
if (location.protocol !== 'file:') {
  for (const [rel,href] of [['manifest','./manifest.webmanifest'],['apple-touch-icon','./icon-192.png']]) {
    const link = document.createElement('link');
    link.rel = rel;
    link.href = href;
    document.head.append(link);
  }
  if (isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
installButton.onclick = async () => {
  if (installPrompt) {
    const prompt = installPrompt;
    installPrompt = undefined;
    try { await prompt.prompt(); return; } catch { /* Show browser instructions. */ }
  }
  const message = get('install-instructions');
  if (location.protocol === 'file:') {
    message.textContent = 'Para instalar en este ordenador, abre la versión web de Freya. Si tienes datos en este archivo, usa Ajustes → Exportar copia para llevarlos a la versión instalada.';
    get('install-local-link').hidden = false;
  } else {
    message.textContent = 'En Edge o Chrome, abre el menú del navegador y elige Instalar aplicación. En iPhone, abre Compartir en Safari y elige Añadir a pantalla de inicio.';
    get('install-local-link').hidden = true;
  }
  installHelp.showModal();
};
get('close-install-help').onclick = () => installHelp.close();

</script>
</body>
</html>
